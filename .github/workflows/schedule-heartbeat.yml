name: Schedule Heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Print heartbeat time
        run: |
          echo "Heartbeat workflow triggered"
          date -u +"UTC time: %Y-%m-%dT%H:%M:%SZ"
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
