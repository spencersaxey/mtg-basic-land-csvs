name: Update MTG Basic Land Sheets

on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-mtg-sheets
  cancel-in-progress: false

jobs:
  update-sheets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate spreadsheets
        run: python scripts/update_sheets.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheets/*.csv README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          run_tag="daily-run"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_tag="manual-run"
          fi
          git commit -m "${run_tag}: update MTG basic land spreadsheets (${ts})"
          git push
